<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: "Georgia", serif;
    color: white;
}

/* ---------- VIDEO SCREEN ---------- */

.video {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

/* ---------- SCENES ---------- */

.scene {
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transform: scale(1.08);
    transition:
        opacity 1.5s ease,
        transform 7s ease;
}

.scene.active {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
}

/* ---------- PHOTO ---------- */

.scene img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(45%);
}

/* ---------- DARK OVERLAY ---------- */

.overlay {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.15),
            rgba(0,0,0,.75)
        );
}

/* ---------- TEXT ---------- */

.text {
    position: absolute;
    left: 50%;
    bottom: 17%;
    width: 90%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 5;
}

.text h1 {
    font-size: clamp(40px, 9vw, 85px);
    color: #fff;
    text-shadow: 0 3px 20px rgba(0,0,0,.8);
    margin-bottom: 25px;
}

.text p {
    font-family: Arial, sans-serif;
    font-size: clamp(18px, 4vw, 30px);
    line-height: 1.7;
    text-shadow: 0 2px 10px #000;
}

.highlight {
    color: #ff7da7;
}

/* ---------- TYPING ---------- */

.typing {
    min-height: 80px;
}

/* ---------- HEARTS ---------- */

.hearts {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 8;
}

.heart {
    position: absolute;
    bottom: -50px;
    animation: floatHeart linear forwards;
    opacity: .8;
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) rotate(0deg) scale(.7);
        opacity: 0;
    }

    15% {
        opacity: .9;
    }

    100% {
        transform:
            translateY(-110vh)
            rotate(360deg)
            scale(1.3);
        opacity: 0;
    }
}

/* ---------- INTRO ---------- */

.intro {
    position: absolute;
    inset: 0;
    z-index: 20;
    background:
        radial-gradient(circle, #4b1234, #080008 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: opacity 1.5s ease;
}

.intro.hide {
    opacity: 0;
    pointer-events: none;
}

.intro-content {
    width: 90%;
}

.big-heart {
    font-size: 100px;
    animation: beat 1.4s infinite;
}

@keyframes beat {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}

.intro h1 {
    font-size: clamp(40px, 10vw, 80px);
    margin: 20px 0;
}

.intro p {
    font-family: Arial, sans-serif;
    font-size: 18px;
    opacity: .8;
}

/* ---------- BUTTON ---------- */

.start-btn {
    margin-top: 35px;
    padding: 15px 35px;
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 40px;
    background: rgba(255,255,255,.1);
    color: white;
    font-size: 18px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: .3s;
}

.start-btn:hover {
    background: #ff4f87;
    transform: scale(1.05);
}

/* ---------- PROGRESS ---------- */

.progress {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    height: 3px;
    background: rgba(255,255,255,.25);
    z-index: 15;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #ff6f9f;
    transition: width .3s linear;
}

/* ---------- FINAL SCENE ---------- */

.final {
    background:
        radial-gradient(circle, #641b45, #090009 70%);
}

.final-content {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-direction: column;
}

.final-heart {
    font-size: 120px;
    animation: beat 1.5s infinite;
}

.final h1 {
    font-size: clamp(55px, 12vw, 110px);
    margin-top: 20px;
}

.final p {
    font-family: Arial, sans-serif;
    font-size: 20px;
    margin-top: 20px;
    opacity: .85;
}
</style>
</head>

<body>

<div class="video">

    <!-- INTRO -->
    <div class="intro" id="intro">
        <div class="intro-content">

            <div class="big-heart">❤️</div>

            <h1>For You</h1>

            <p>
                I have something I really want to say...
            </p>

            <button class="start-btn" onclick="startVideo()">
                Start ❤️
            </button>

        </div>
    </div>


    <!-- PROGRESS BAR -->
    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>


    <!-- FALLING HEARTS -->
    <div class="hearts" id="hearts"></div>


    <!-- SCENE 1 -->
    <section class="scene active">

        <img src="photo1.jpg">

        <div class="overlay"></div>

        <div class="text">

            <h1> <span class="highlight">Sorry Gelhi ❤️</span></h1>

            <p class="typing"
               data-text="Before anything else... I just want you to know how truly sorry I am.">
            </p>

        </div>

    </section>


    <!-- SCENE 2 -->
    <section class="scene">

        <img src="photo2.jpg">

        <div class="overlay"></div>

        <div class="text">

            <h1>I'm Sorry.</h1>

            <p class="typing"
               data-text="I know I made a mistake. I know my actions hurt you, and I regret it.">
            </p>

        </div>

    </section>


    <!-- SCENE 3 -->
    <section class="scene">

        <img src="photo3.jpg">

        <div class="overlay"></div>

        <div class="text">

            <h1>I Was Wrong.</h1>

            <p class="typing"
               data-text="I should have thought about your feelings before I acted. You didn't deserve that.">
            </p>

        </div>

    </section>


    <!-- SCENE 4 -->
    <section class="scene">

        <img src="photo4.jpg">

        <div class="overlay"></div>

        <div class="text">

            <h1>Please Understand Mama  🥺</h1>

            <p class="typing"
               data-text="I'm not asking you to forget what happened. I just hope you can forgive my mistake.">
            </p>

        </div>

    </section>


    <!-- SCENE 5 -->
    <section class="scene">

        <img src="photo5.jpg">

        <div class="overlay"></div>

        <div class="text">

            <h1>You Matter To Me.</h1>

            <p class="typing"
               data-text="Our moments together mean so much to me, and I don't want one mistake to erase everything beautiful.">
            </p>

        </div>

    </section>


    <!-- SCENE 6 -->
    <section class="scene">

        <img src="photo6.jpg">

        <div class="overlay"></div>

        <div class="text">

            <h1>I Will Learn.</h1>

            <p class="typing"
               data-text="I can't change the past, but I can learn from my mistake and do better from your expection.">
            </p>

        </div>

    </section>


    <!-- FINAL -->
    <section class="scene final">

        <div class="final-content">

            <div class="final-heart">❤️</div>

            <h1>I'm Sorry</h1>

            <p>
                Truly, honestly and from my heart.
            </p>

            <p style="margin-top:25px;">
                ❤️ Please understand Mama  ❤️
            </p>

        </div>

    </section>

</div>


<!-- MUSIC -->
<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>


<script>

const scenes = document.querySelectorAll(".scene");
const progressBar = document.getElementById("progressBar");
const intro = document.getElementById("intro");
const music = document.getElementById("music");

let currentScene = 0;
let playing = false;

const sceneDuration = 7000;


/* ---------- START ---------- */

function startVideo() {

    if (playing) return;

    playing = true;

    intro.classList.add("hide");

    music.volume = 0.45;

    music.play().catch(() => {});

    showScene(0);

    createHearts();

    setTimeout(nextScene, sceneDuration);
}


/* ---------- SHOW SCENE ---------- */

function showScene(index) {

    scenes.forEach(scene => {
        scene.classList.remove("active");
    });

    scenes[index].classList.add("active");

    typeText(index);

    updateProgress();
}


/* ---------- NEXT SCENE ---------- */

function nextScene() {

    currentScene++;

    if (currentScene >= scenes.length) {
        currentScene = scenes.length - 1;
        showScene(currentScene);
        return;
    }

    showScene(currentScene);

    setTimeout(nextScene, sceneDuration);
}


/* ---------- TYPING EFFECT ---------- */

function typeText(index) {

    const element =
        scenes[index].querySelector(".typing");

    if (!element) return;

    const text = element.dataset.text;

    element.innerHTML = "";

    let i = 0;

    const typingSpeed = 35;

    function type() {

        if (i < text.length) {

            element.innerHTML += text.charAt(i);

            i++;

            setTimeout(type, typingSpeed);
        }
    }

    type();
}


/* ---------- PROGRESS ---------- */

function updateProgress() {

    const percentage =
        (currentScene / (scenes.length - 1)) * 100;

    progressBar.style.width = percentage + "%";
}


/* ---------- FALLING HEARTS ---------- */

function createHearts() {

    const container =
        document.getElementById("hearts");

    setInterval(() => {

        const heart =
            document.createElement("div");

        heart.className = "heart";

        const hearts =
            ["❤️","💕","💗","💖","💓","💞"];

        heart.innerHTML =
            hearts[Math.floor(Math.random() * hearts.length)];

        heart.style.left =
            Math.random() * 100 + "%";

        heart.style.fontSize =
            (15 + Math.random() * 30) + "px";

        const duration =
            5 + Math.random() * 6;

        heart.style.animationDuration =
            duration + "s";

        container.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, duration * 1000);

    }, 500);
}

</script>

</body>
</html>
